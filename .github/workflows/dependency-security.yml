name: Dependency security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:2.10.2
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Prepare clean Laravel test environment
        working-directory: backend
        run: |
          cp .env.example .env
          find bootstrap/cache -maxdepth 1 -type f -name '*.php' -delete
      - name: Install locked PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Reject vulnerable or abandoned PHP packages
        working-directory: backend
        run: composer audit --locked --abandoned=fail
      - name: Run backend regression suite
        working-directory: backend
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Reject high or critical npm vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Run frontend regression suite
        working-directory: frontend
        run: npm test

  container-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: backend/dockerfile
            context: backend
          - name: frontend
            dockerfile: frontend/dockerfile
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: cuidado-${{ matrix.name }}:security-scan
      - name: Reject high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cuidado-${{ matrix.name }}:security-scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
