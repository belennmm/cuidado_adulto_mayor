name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detectar secretos y respaldos
        shell: pwsh
        run: ./tools/scan-secrets.ps1
