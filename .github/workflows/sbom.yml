name: Generate SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate repository SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@v0.20.8
        with:
          path: .
          format: cyclonedx-json
          output-file: cuidado-adulto-mayor.cdx.json
          upload-artifact: false
      - name: Upload version SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: cuidado-adulto-mayor.cdx.json
          if-no-files-found: error
          retention-days: 90
