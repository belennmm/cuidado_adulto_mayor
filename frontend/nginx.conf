server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' https://fonts.googleapis.com https://unpkg.com/boxicons@2.1.4/css/; style-src-attr 'none'; font-src 'self' https://fonts.gstatic.com https://unpkg.com/boxicons@2.1.4/fonts/; img-src 'self' data:; script-src 'self'; script-src-attr 'none'; connect-src 'self'; object-src 'none'; frame-src https://www.youtube.com/embed/; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location ^~ /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:env|ini|log|sql|bak|conf)$ {
        deny all;
    }
}
