<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Restablecer contraseña</title>
  <link rel="stylesheet" href="../css/password-recovery.css">
</head>
<body><main>
  <h1>Restablecer contraseña</h1>
  <p>Usa al menos 15 caracteres con mayúsculas, minúsculas, números y símbolos. Evita contraseñas comunes o comprometidas.</p>
  <form id="recoveryForm" data-mode="reset">
    <label for="email">Correo electrónico</label>
    <input id="email" name="email" type="email" maxlength="254" autocomplete="username" required>
    <label for="token">Código recibido por correo</label>
    <input id="token" name="token" type="text" minlength="64" maxlength="64" pattern="[a-fA-F0-9]{64}" autocomplete="off" required>
    <label for="password">Nueva contraseña</label>
    <input id="password" name="password" type="password" minlength="15" maxlength="128" autocomplete="new-password" required>
    <label for="password_confirmation">Confirmar contraseña</label>
    <input id="password_confirmation" name="password_confirmation" type="password" minlength="15" maxlength="128" autocomplete="new-password" required>
    <button type="submit">Guardar contraseña</button>
  </form>
  <p id="recoveryMessage" role="status" aria-live="polite"></p>
  <a href="./forgot-password.html">Solicitar otro enlace</a>
  <a href="../index.html">Iniciar sesión</a>
</main>
<script src="../js/url-utils.js"></script>
<script src="../js/api-config.js"></script>
<script src="../js/password-recovery.js"></script>
</body></html>
