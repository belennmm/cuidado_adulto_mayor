<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movilidad</title>

    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/cuidador-profesional/professional-layout.css" />
    <link rel="stylesheet" href="../../css/cuidador-profesional/mobility.css" />
    <link rel="stylesheet" href="../../css/logout-modal.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="professional-home">
      <aside class="sidebar">
        <div class="sidebar-top"></div>

        <nav class="sidebar-nav">
          <a href="./home-page.html" class="nav-icon" data-label="Inicio"><i class="bx bxs-home"></i></a>
          <a href="./dashboard.html" class="nav-icon" data-label="Dashboard"><i class="bx bxs-dashboard"></i></a>
          <a href="./shift.html" class="nav-icon" data-label="Turnos"><i class="bx bxs-time"></i></a>
          <a href="./adultos-mayores.html" class="nav-icon" data-label="Adultos mayores"><i class="bx bxs-id-card"></i></a>
          <a href="./routines.html" class="nav-icon active" data-label="Rutinas"><i class="bx bxs-star"></i></a>
          <a href="./incidents.html" class="nav-icon" data-label="Incidentes"><i class="bx bxs-error"></i></a>
        </nav>

        <div class="sidebar-bottom">
          <a href="./user-settings.html" class="nav-icon" data-label="Perfil"><i class="bx bx-user-circle"></i></a>
          <a href="#" class="nav-icon logout-trigger" data-label="Cerrar sesión"><i class="bx bx-log-out"></i></a>
        </div>
      </aside>

      <main class="main-content">
        <section class="mobility-page" aria-labelledby="mobilityTitle" aria-describedby="mobilityDescription">
          <div class="mobility-header">
            <div>
              <p class="mobility-eyebrow">Rutinas</p>
              <h1 id="mobilityTitle">Movilidad</h1>
              <p id="mobilityDescription">Ejercicios generales de movilidad para adultos mayores.</p>
            </div>
            <a href="./routines.html" class="mobility-back-link"><i class="bx bx-arrow-back"></i>Volver a rutinas</a>
          </div>

          <section class="mobility-content" aria-labelledby="mobilityExercisesTitle">
            <div class="mobility-content-heading">
              <i class="bx bx-walk" aria-hidden="true"></i>
              <div>
                <h2 id="mobilityExercisesTitle">Ejercicios de movilidad</h2>
                <p>Consulta ejercicios guiados de movilidad y sigue su demostración en video.</p>
              </div>
            </div>
            <div id="mobilityExercises" class="mobility-exercises" aria-live="polite"></div>
          </section>
        </section>
      </main>
    </div>

    <div class="logout-modal-overlay" id="logoutModal">
      <div class="logout-modal-box">
        <h3 class="logout-modal-title">Cerrar sesión</h3>
        <p class="logout-modal-text">¿Seguro que deseas cerrar sesión?</p>
        <div class="logout-modal-actions">
          <button type="button" class="logout-cancel-button" id="cancelLogout">Cancelar</button>
          <button type="button" class="logout-confirm-button" id="confirmLogout">Aceptar</button>
        </div>
      </div>
    </div>

    <script src="../../js/app-loading.js"></script>
    <script src="../../js/api-config.js"></script>
    <script src="../../js/auth-session.js"></script>
    <script src="../../js/logout-modal.js"></script>
    <script src="../../js/auth-guard-profesional.js"></script>
    <script src="../../js/sidebar-a11y.js"></script>
    <script src="../../js/care-notifications.js"></script>
    <script type="module" src="../../js/mobility.js"></script>
  </body>
</html>
