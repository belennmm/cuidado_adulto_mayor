<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incidentes Cuidador Profesional</title>

    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/cuidador-profesional/professional-layout.css" />
    <link rel="stylesheet" href="../../css/cuidador-profesional/home-page.css" />
    <link rel="stylesheet" href="../../css/incidents.css" />
    <link rel="stylesheet" href="../../css/logout-modal.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body>
    <div class="professional-home">
        <aside class="sidebar">
            <div class="sidebar-top"></div>

            <nav class="sidebar-nav">
                <a href="./home-page.html" class="nav-icon" data-label="Inicio">
                    <i class="bx bxs-home"></i>
                </a>

                <a href="./dashboard.html" class="nav-icon" data-label="Dashboard">
                    <i class="bx bxs-dashboard"></i>
                </a>

                <a href="./shift.html" class="nav-icon" data-label="Turnos">
                    <i class="bx bxs-time"></i>
                </a>

                <a href="./adultos-mayores.html" class="nav-icon" data-label="Adultos mayores">
                    <i class="bx bxs-id-card"></i>
                </a>

                <a href="./routines.html" class="nav-icon" data-label="Rutinas">
                    <i class="bx bxs-star"></i>
                </a>

                <a href="./incidents.html" class="nav-icon active" data-label="Incidentes">
                    <i class="bx bxs-error"></i>
                </a>
            </nav>

            <div class="sidebar-bottom">
                <a href="./user-settings.html" class="nav-icon" data-label="Perfil">
                    <i class="bx bx-user-circle"></i>
                </a>

                <a href="#" class="nav-icon logout-trigger" data-label="Cerrar sesión">
                    <i class="bx bx-log-out"></i>
                </a>
            </div>
        </aside>
        <main class="main-content">
            <section class="incidents-page">
                <div class="incidents-header">
                    <div>
                        <h1 class="incidents-title">Incidentes del día</h1>
                        <div class="incidents-date-row">
                            <div class="incidents-date" id="incidentsDate">Hoy</div>
                            <input type="date" class="incidents-date-input" id="incidentsDateInput" aria-label="Seleccionar fecha" />
                        </div>
                    </div>

                    <div class="incidents-counter">
                        <i class="bx bxs-error"></i>
                        <span id="incidentsCount">0</span>
                    </div>
                </div>

                <div style="display: flex; flex-wrap: wrap; gap: 12px;">
                    <button type="button" class="dashboard-button" id="registerIncidentButton">
                        <i class="bx bx-plus"></i>
                        Registrar incidente
                    </button>
                    <a href="./shift.html" class="dashboard-button">Ver turnos</a>
                    <a href="./routines.html" class="dashboard-button">Ver rutinas</a>
                    <a href="./adultos-mayores.html" class="dashboard-button">Adultos mayores</a>
                </div>

                <section class="incidents-list" id="incidentsList"></section>
            </section>
        </main>
    </div>

    <div class="incident-form-overlay" id="incidentFormModal" hidden>
        <section class="incident-form-dialog" role="dialog" aria-modal="true" aria-labelledby="incidentFormTitle">
            <div class="incident-form-header">
                <div>
                    <h2 id="incidentFormTitle">Registrar incidente</h2>
                    <p>Ingresa los datos del incidente ocurrido.</p>
                </div>
                <button type="button" class="incident-form-close" id="closeIncidentForm" aria-label="Cerrar formulario">
                    <i class="bx bx-x"></i>
                </button>
            </div>

            <form class="incident-form" id="incidentForm">
                <label class="incident-form-field">
                    <span>Adulto mayor</span>
                    <select id="incidentOlderAdult" name="older_adult_id" required>
                        <option value="">Selecciona un adulto mayor</option>
                    </select>
                </label>

                <label class="incident-form-field">
                    <span>Título del incidente</span>
                    <input type="text" id="incidentTitle" name="title" maxlength="255"
                        placeholder="Ejemplo: Caída leve" required />
                </label>

                <label class="incident-form-field incident-form-field-full">
                    <span>Descripción</span>
                    <textarea id="incidentDescription" name="description" maxlength="2000" rows="4"
                        placeholder="Describe qué ocurrió y las acciones realizadas"></textarea>
                </label>

                <label class="incident-form-field">
                    <span>Severidad</span>
                    <select id="incidentSeverity" name="severity">
                        <option value="baja">Baja</option>
                        <option value="media" selected>Media</option>
                        <option value="alta">Alta</option>
                    </select>
                </label>

                <label class="incident-form-field">
                    <span>Fecha</span>
                    <input type="date" id="incidentDate" name="incident_date" required />
                </label>

                <label class="incident-form-field">
                    <span>Hora</span>
                    <input type="time" id="incidentTime" name="incident_time" required />
                </label>

                <p class="incident-form-message" id="incidentFormMessage" role="alert" hidden></p>

                <div class="incident-form-actions">
                    <button type="button" class="incident-cancel-button" id="cancelIncidentForm">Cancelar</button>
                    <button type="submit" class="incident-submit-button" id="submitIncidentForm">
                        <i class="bx bx-save"></i>
                        Guardar incidente
                    </button>
                </div>
            </form>
        </section>
    </div>

    <div class="logout-modal-overlay" id="logoutModal">
        <div class="logout-modal-box">
            <h3 class="logout-modal-title">Cerrar sesión</h3>
            <p class="logout-modal-text">¿Seguro que deseas cerrar sesión?</p>

            <div class="logout-modal-actions">
                <button type="button" class="logout-cancel-button" id="cancelLogout">
            Cancelar
          </button>
                <button type="button" class="logout-confirm-button" id="confirmLogout">
            Aceptar
          </button>
            </div>
        </div>
    </div>


    <script src="../../js/app-loading.js"></script>
    <script src="../../js/api-config.js"></script>
  <script src="../../js/auth-session.js"></script>

    <script src="../../js/logout-modal.js"></script>
    <script src="../../js/auth-guard-profesional.js"></script>
    <script src="../../js/sidebar-active.js"></script>
    <script src="../../js/sidebar-a11y.js"></script>
    <script src="../../js/care-notifications.js"></script>
    <script src="../../js/incidents.js"></script>

</body>

</html>
