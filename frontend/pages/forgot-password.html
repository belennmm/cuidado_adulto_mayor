<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Recuperar contraseña</title>
  <link rel="stylesheet" href="../css/password-recovery.css">
</head>
<body><main>
  <h1>Recuperar contraseña</h1>
  <p>Recibirás un enlace de un solo uso, válido durante 15 minutos.</p>
  <form id="recoveryForm" data-mode="request">
    <label for="email">Correo electrónico</label>
    <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
    <button type="submit">Enviar enlace</button>
  </form>
  <p id="recoveryMessage" role="status" aria-live="polite"></p>
  <a href="../index.html">Volver a iniciar sesión</a>
</main>
<script src="../js/url-utils.js"></script>
<script src="../js/api-config.js"></script>
<script src="../js/password-recovery.js"></script>
</body></html>
