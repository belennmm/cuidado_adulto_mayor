services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
      target: production
    container_name: cuidado_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME:-Cuidado Adulto Mayor}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:?APP_KEY is required}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:?APP_URL is required}"
      APP_TIMEZONE: "${APP_TIMEZONE:-America/Guatemala}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${POSTGRES_DB:-cuidado_adulto_mayor}"
      DB_USERNAME: "${POSTGRES_USER:-cuidado_user}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      DB_SSLMODE: "${DB_SSLMODE:-require}"
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      RUN_SEEDERS: "${RUN_SEEDERS:-false}"
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:3000,localhost:8080,127.0.0.1,127.0.0.1:3000,127.0.0.1:8080}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}"
      SANCTUM_EXPIRATION: "${SANCTUM_EXPIRATION:-60}"
      HASH_DRIVER: argon2id
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      SESSION_HTTP_ONLY: "${SESSION_HTTP_ONLY:-true}"
      SESSION_SAME_SITE: "${SESSION_SAME_SITE:-lax}"
      SESSION_ENCRYPT: "${SESSION_ENCRYPT:-true}"
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
    ports:
      - "${BACKEND_PORT:-8080}:80"
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    networks:
      - cuidado_network

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: dockerfile
      target: testing
    environment:
      APP_ENV: testing
    networks:
      - cuidado_network

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: cuidado_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - cuidado_network

  postgres:
    image: postgres:16.15-alpine
    container_name: cuidado_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-cuidado_adulto_mayor}"
      POSTGRES_USER: "${POSTGRES_USER:-cuidado_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cuidado_network

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: cuidado_pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - cuidado_network

networks:
  cuidado_network:
    driver: bridge

volumes:
  backend_storage:
  backend_cache:
  postgres_data:
  pgadmin_data:
